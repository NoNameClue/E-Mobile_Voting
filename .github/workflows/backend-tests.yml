name: Backend Automated Tests

on:
  push:
    branches: [ "Fix-System" ]
  pull_request:
    branches: [ "Fix-System" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-sugar

    - name: Prepare Environment
      # 🛠️ CREATE UPLOADS FOLDER: Essential for your file upload tests
      working-directory: ./backend
      run: mkdir -p uploads

    - name: Run Pytest
      working-directory: ./backend
      # 🛠️ ADDED -v: Gives you a detailed list of all 120+ tests in the console
      run: pytest -v test_main.py
      env:
        TESTING: True